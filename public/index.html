<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amri Secure Chat</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 id="auth-title">Welcome</h2>
        <input type="text" id="auth-user" placeholder="Username" autocomplete="off" />
        <input type="password" id="auth-pass" placeholder="Password" />
        <button onclick="handleAuth()" id="auth-btn">Login</button>
        <p onclick="toggleAuth()" id="toggle-text">New here? Create Account</p>
    </div>
</div>

<div class="main-container">
    <div class="sidebar">
        <h3 style="font-size: 11px; opacity: 0.5; letter-spacing: 2px; margin-bottom: 20px;">DIRECT MESSAGES</h3>
        <ul id="users">
            <li class="user-item active" onclick="setChatTarget('Global')">🌍 Global Lobby</li>
        </ul>
    </div>
    
    <div class="chat-area">
        <div class="chat-header">
            <div id="target-info">
                <span id="target-display">Global Lobby</span>
                <small id="online-status">Active Now</small>
            </div>
        </div>
        
        <ul id="messages"></ul>
        
        <form id="form">
            <div id="record-status">● Recording...</div>
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" style="display:none" />
            <input id="input" placeholder="Type a message..." autocomplete="off" />
            <button type="button" id="mic-btn" class="icon-btn">🎤</button>
            <button type="submit" id="send-btn">➤</button>
        </form>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js?v=5"></script>
</body>
</html>
