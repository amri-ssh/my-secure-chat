<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat Cloud</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 id="auth-title">Welcome</h2>
        <input type="text" id="auth-user" placeholder="Username" autocomplete="off" />
        <input type="password" id="auth-pass" placeholder="Password" />
        <button onclick="handleAuth()" id="auth-btn">Login</button>
        <p onclick="toggleAuth()" id="toggle-text">New here? Create Account</p>
    </div>
</div>

<div class="main-container">
    <div class="sidebar">
        <h3>Online Users</h3>
        <ul id="users"></ul>
    </div>
    
    <div class="chat-area">
        <ul id="messages"></ul>
        
        <form id="form">
            <div id="record-status"><span class="pulse">●</span> Recording...</div>
            
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" style="display:none" />
            
            <input id="input" placeholder="Type a message..." autocomplete="off" />
            
            <button type="button" id="mic-btn" class="icon-btn">🎤</button>
            <button type="submit" id="send-btn">➤</button>
        </form>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
